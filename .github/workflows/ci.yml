name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start Postgres via Testcontainers (Docker is available on ubuntu runners)
      - run: ./mvnw -B verify

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Full `next build` prerenders pages from the API, so it runs in a later
      # deploy pipeline with the API available. Here we type-check only.
      - run: npx next typegen && npx tsc --noEmit
